services:
  - type: keyvalue
    name: gastroia-redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: gastroia-api
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    healthCheckPath: /api/v1/health/live
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_GLOBAL_PREFIX
        value: api/v1
      - key: DATABASE_URL
        fromDatabase:
          name: gastroia-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: gastroia-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: TENANT_JWT_ACCESS_SECRET
        generateValue: true
      - key: TENANT_JWT_ISSUER
        value: gastroia-tenant-api
      - key: PLATFORM_JWT_ACCESS_SECRET
        generateValue: true
      - key: PLATFORM_JWT_ISSUER
        value: gastroia-platform-api
      - key: JWT_ISSUER
        value: gastroia-api
      - key: JWT_AUDIENCE
        value: gastroia-app
      - key: CORS_ORIGINS
        value: https://gastroia-web.onrender.com
      - key: ENABLE_SWAGGER
        value: "false"
      - key: SEED_TENANT_NAME
        value: GastroIA Demo
      - key: SEED_TENANT_SLUG
        value: gastroia-demo
      - key: SEED_BRANCH_NAME
        value: Sede Principal
      - key: SEED_BRANCH_CODE
        value: MAIN
      - key: SEED_OWNER_EMAIL
        value: owner@gastroai.local
      - key: SEED_OWNER_PASSWORD
        sync: false
      - key: SEED_PLATFORM_OWNER_EMAIL
        value: platform@gastroai.local
      - key: SEED_PLATFORM_OWNER_PASSWORD
        sync: false

  - type: web
    name: gastroia-web
    runtime: static
    plan: free
    branch: main
    buildCommand: curl -fsSL https://bun.sh/install | bash && export BUN_INSTALL="$HOME/.bun" && export PATH="$BUN_INSTALL/bin:$PATH" && bun install --frozen-lockfile && bun run --filter @gastroai/contracts build && bun run --filter @gastroai/desktop build
    staticPublishPath: apps/desktop/out/renderer
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_BASE_URL
        value: https://gastroia-api.onrender.com/api/v1
      - key: VITE_API_ORIGIN
        value: https://gastroia-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

databases:
  - name: gastroia-postgres
    databaseName: gastroia
    user: gastroia
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: 16
